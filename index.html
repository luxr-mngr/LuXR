  // Helper to resolve asset paths dynamically
  const resolveAsset = (path) => {
    const isStaticRoot = !!document.querySelector('link[href^="public/"]');
    return isStaticRoot ? path : path.replace(/^public\//, '/');

    tagline: 'Light into worlds.',

  function useTweaks(defaults) {
    const [vals, setVals] = React.useState(() => {
      try { return { ...defaults, ...JSON.parse(localStorage.getItem('luxr-tweaks') || '{}') }; }
      catch { return { ...defaults }; }
    });
    const set = React.useCallback((key, val) => {
      setVals(prev => {
        const next = { ...prev, [key]: val };
        try { localStorage.setItem('luxr-tweaks', JSON.stringify(next)); } catch {}
        return next;
      });
    }, []);
    return [vals, set];
  }

  function TweakSection({ label, children }) {
    return (
      <div className="tweak-section">
        <span className="tweak-section-label">{label}</span>
        {children}
      </div>
    );
  }

  function TweakRadio({ options, value, onChange }) {
    return (
      <div className="tweak-radios">
        {options.map(o => (

            <div className="tweak-dot" />{o}
          </div>
        ))}
      </div>
    );
  }

  function TweakSelect({ options, value, onChange }) {
    return (

        {options.map(o => <option key={o} value={o}>{o}</option>)}

  function Nav({ theme }) {
    const [scrolled, setScrolled] = React.useState(false);

        const sy = window.scrollY + 80;

        ['mission','capabilities','portfolio','contact'].forEach(id => {
          const el = document.getElementById(id);
          if (el && el.offsetTop <= sy) cur = id;
        });
        setActive(cur);
      };
      window.addEventListener('scroll', handler, { passive: true });
      return () => window.removeEventListener('scroll', handler);
    }, []);

    const goto = (id) => {
      if (!id) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      const el = document.getElementById(id);
      if (el) window.scrollTo({ top: el.offsetTop - 64, behavior: 'smooth' });
    };

    return (
      <nav className={`nav${scrolled ? ' scrolled' : ''}`}>

  }

  // ─── PointCloud ───────────────────────────────────────────────
  function PointCloud() {
    const svgRef = React.useRef(null);

    React.useEffect(() => {
      const svg = svgRef.current;
      if (!svg) return;

      const COUNT = 560;
      const golden = Math.PI * (3 - Math.sqrt(5));
      const points = [];
      const circles = [];

      for (let i = 0; i < COUNT; i++) {
        const y = 1 - (i / (COUNT - 1)) * 2;
        const r = Math.sqrt(1 - y * y);
        const theta = golden * i;
        points.push([Math.cos(theta) * r, y, Math.sin(theta) * r]);

        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        svg.appendChild(c);
        circles.push(c);
      }

      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let rafId;

      const render = (t) => {
        const a = t * 0.1;
        const b = a * 0.35 + 0.4;
        const cosA = Math.cos(a), sinA = Math.sin(a);
        const cosB = Math.cos(b), sinB = Math.sin(b);

        for (let i = 0; i < COUNT; i++) {
          const [px, py, pz] = points[i];
          const x1 = px * cosA - pz * sinA;
          const z1 = px * sinA + pz * cosA;
          const y2 = py * cosB - z1 * sinB;
          const z2 = py * sinB + z1 * cosB;

          const depth = (z2 + 1) / 2;
          const c = circles[i];
          c.setAttribute('cx', 500 + x1 * 168);
          c.setAttribute('cy', 215 + y2 * 168);
          c.setAttribute('r', 0.5 + depth * 2.1);
          c.setAttribute('opacity', 0.1 + depth * 0.72);
          c.setAttribute('fill', depth > 0.62 ? 'var(--accent-2)' : 'var(--accent)');
        }
      };

      if (prefersReduced) {
        render(0.6);
        return;
      }

      let t = 0;
      const loop = () => {
        t += 0.016;
        render(t);
        rafId = requestAnimationFrame(loop);
      };
      rafId = requestAnimationFrame(loop);

      return () => {
        cancelAnimationFrame(rafId);
        circles.forEach(c => c.remove());
      };
    }, []);

    return (
      <svg
        ref={svgRef}
        viewBox="0 0 1000 430"
        preserveAspectRatio="xMidYMid meet"
        aria-hidden="true"
      />
    );
  }

  // ─── Hero ─────────────────────────────────────────────────────
  function Hero({ tweaks }) {
    const lightRef = React.useRef(null);
    const h1Ref = React.useRef(null);
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const taglineMap = {
      'Light into worlds.':     ['Light into', 'worlds.'],
      'Step into the unreal.':  ['Step into', 'the unreal.'],
      'Reality, reimagined.':   ['Reality,', 'reimagined.'],
      'Enter elsewhere.':       ['Enter', 'elsewhere.'],
      'We build immersive XR.': ['We build', 'immersive XR.'],
    };
    const lines = taglineMap[tweaks.tagline] || [tweaks.tagline];

    React.useEffect(() => {
      if (prefersReduced) return;
      let raf;
      const handler = (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 120;
        const y = (e.clientY / window.innerHeight - 0.5) * 100;
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
          if (lightRef.current)
            lightRef.current.style.transform = `translate(calc(-50% + ${x}px), ${y}px)`;
        });
      };
      window.addEventListener('mousemove', handler);
      return () => { window.removeEventListener('mousemove', handler); cancelAnimationFrame(raf); };
    }, [prefersReduced]);

    React.useEffect(() => {
      if (h1Ref.current) h1Ref.current.classList.remove('in');
      const t = setTimeout(() => { if (h1Ref.current) h1Ref.current.classList.add('in'); }, 60);
      return () => clearTimeout(t);
    }, [tweaks.tagline]);

    const sparkSize = Math.min(80, 0.09 * window.innerWidth + 30);
    const goto = (id) => {
      const el = document.getElementById(id);
      if (el) window.scrollTo({ top: el.offsetTop - 64, behavior: 'smooth' });
    };

    return (

        <div className="hero-grid" aria-hidden="true" />
        <div className="hero-light" ref={lightRef} aria-hidden="true" />
        <div className="hero-grain" aria-hidden="true" />
        <div className="hero-illo" aria-hidden="true"><PointCloud /></div>

        <div className="wrap hero-inner">

            XR<span className="sep" />VR<span className="sep" />Extended Reality Studio

          <h1 className="display hero-h1" ref={h1Ref}>
            <span className="hero-h1-wrap">
              {lines.map((line, i) => (
                <span className="ln" key={i}>
                  <span style={{ transitionDelay: `${120 + i * 90}ms` }}>{line}</span>
                </span>
              ))}
              <span className="hero-spark" style={{ top: 0, right: -(sparkSize + 8) }}>
                <Spark size={sparkSize} className="twinkle" />
              </span>
            </span>
          </h1>

          <p className="hero-sub reveal snap">
            An XR VR studio crafting immersive experiences in{' '}
            <strong style={{ color: 'var(--text)', whiteSpace: 'nowrap' }}>Unreal Engine 5</strong>,
            built in Lima, Peru, deployed globally.
          </p>

          <div className="tags reveal snap">
            {['Unreal Engine 5','OpenXR','Android XR','Meta Quest','Photogrammetry','Hand Tracking'].map(t => (
              <span key={t} className="tag">{t}</span>
            ))}
          </div>

          <div className="hero-cta-row reveal snap">
            <button className="btn btn-primary" onClick={() => goto('portfolio')}>View our work <Arrow /></button>
            <button className="btn btn-ghost" onClick={() => goto('contact')}>Start a project <Arrow /></button>
          </div>
        </div>

        <div className="hero-meta">
          <span>Lima, Peru   Deployed globally</span>
          <div className="scroll-cue">
            <span>Scroll</span>
            <div className="scroll-bar" />
          </div>
        </div>
      </section>
    );
  }

  function TiltCard({ children, onClick }) {
    const ref = React.useRef(null);
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const onMove = React.useCallback((e) => {
      if (prefersReduced || !ref.current) return;
      const r = ref.current.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      ref.current.style.transform = `perspective(900px) rotateY(${x*10}deg) rotateX(${-y*10}deg) translateY(-4px)`;
    }, [prefersReduced]);
    const onLeave = React.useCallback(() => { if (ref.current) ref.current.style.transform = ''; }, []);
    return (
      <div ref={ref} className="tilt-card" onMouseMove={onMove} onMouseLeave={onLeave} onClick={onClick}>
        {children}
      </div>
    );
  }

  function Modal({ project, onClose }) {
    const [idx, setIdx] = React.useState(0);
    const imgs = project ? (project.images || []) : [];

    React.useEffect(() => {
      setIdx(0);
      document.body.style.overflow = 'hidden';
      const onKey = (e) => {
        if (e.key === 'Escape') onClose();
        if (e.key === 'ArrowLeft')  setIdx(i => (i - 1 + imgs.length) % imgs.length);
        if (e.key === 'ArrowRight') setIdx(i => (i + 1) % imgs.length);
      };
      window.addEventListener('keydown', onKey);
      return () => { document.body.style.overflow = ''; window.removeEventListener('keydown', onKey); };
    }, [onClose, project]);

    if (!project) return null;

    const btnStyle = (side) => ({
      position:'absolute', [side]:12, top:'50%', transform:'translateY(-50%)',
      background:'rgba(0,0,0,0.45)', border:'none', color:'white',
      width:36, height:36, borderRadius:'50%', cursor:'pointer',
      fontSize:22, lineHeight:1, display:'flex', alignItems:'center', justifyContent:'center',

    return (
      <div className="modal-backdrop" onClick={onClose}>
        <div className="modal-panel" onClick={e => e.stopPropagation()}>
          <div className="modal-media" style={{ position:'relative', overflow:'hidden' }}>
            {imgs.length > 0 ? (

  // ─── App root ─────────────────────────────────────────────────
  function App() {
    const [tweaks, setTweak] = useTweaks(DEFAULTS);

    React.useEffect(() => {
      const html = document.documentElement;
      html.setAttribute('data-theme', tweaks.theme === 'Daylight' ? 'day' : 'midnight');
      html.setAttribute('data-accent', tweaks.accent);
      html.setAttribute('data-font', tweaks.displayFont);
      html.setAttribute('data-tagstyle', tweaks.tagStyle);
      html.setAttribute('data-heromotion', tweaks.heroMotion);
      html.setAttribute('data-eyebrow', tweaks.eyebrowStyle);
      html.style.setProperty('--li', tweaks.lightIntensity / 100);
    }, [tweaks]);

    // Scroll progress bar
    React.useEffect(() => {
      const bar = document.getElementById('scroll-bar');
      let raf;
      const handler = () => {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
          const max = document.documentElement.scrollHeight - window.innerHeight;
          if (bar) bar.style.width = (max > 0 ? (window.scrollY / max) * 100 : 0) + '%';
        });
      };
      window.addEventListener('scroll', handler, { passive: true });
      return () => { window.removeEventListener('scroll', handler); cancelAnimationFrame(raf); };
    }, []);

    // Reveal on scroll
    React.useEffect(() => {
      const els = () => document.querySelectorAll('.reveal:not(.snap):not(.in)');
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) { entry.target.classList.add('in'); io.unobserve(entry.target); }
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
      const observe = () => els().forEach(el => io.observe(el));
      observe();
      const mo = new MutationObserver(observe);
      mo.observe(document.body, { childList: true, subtree: true });
      return () => { io.disconnect(); mo.disconnect(); };
    }, []);

    // Floating motes
    React.useEffect(() => {
      if (tweaks.heroMotion !== 'Floating motes') return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const hero = document.querySelector('.hero');
      if (!hero) return;
      let canvas = document.createElement('canvas');
      canvas.className = 'motes-canvas';
      canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;';
      hero.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      let animId;
      const motes = Array.from({ length: 28 }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight + window.innerHeight,
        r: Math.random() * 2 + 0.5, speed: Math.random() * 0.4 + 0.15, alpha: Math.random() * 0.5 + 0.1,
      }));
      const resize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
      resize();
      window.addEventListener('resize', resize);
      const draw = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        motes.forEach(m => {
          m.y -= m.speed;
          if (m.y < -10) { m.y = canvas.height + 10; m.x = Math.random() * canvas.width; }
          ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(91,121,255,${m.alpha})`; ctx.fill();
        });
        animId = requestAnimationFrame(draw);
      };
      draw();
      return () => { cancelAnimationFrame(animId); window.removeEventListener('resize', resize); canvas.remove(); };
    }, [tweaks.heroMotion]);

    return (
      <>
        <div id="scroll-bar" aria-hidden="true" />
        <Nav theme={tweaks.theme} />
        <main>
          <Hero tweaks={tweaks} />
          <Mission />
          <Capabilities />
          <Portfolio />
          <Clients />
          <Contact />
        </main>
        <Footer theme={tweaks.theme} />
        <TweaksPanel tweaks={tweaks} setTweak={setTweak} />
      </>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(React.createElement(App));
  </script>
